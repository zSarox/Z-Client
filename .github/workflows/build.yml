name: Build DLL

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Build
        run: dotnet build -c Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonMod-DLL
          path: bin/Release/net6.0/*.dll
